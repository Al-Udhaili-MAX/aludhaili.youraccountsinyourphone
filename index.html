<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>يرجى الانتظار...</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0d1b2a;
      font-family: 'Tajawal', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #fff;
      text-align: center;
    }
    .creator {
      font-size: 24px;
      margin-bottom: 30px;
    }
    .spinner-container {
      position: relative;
      width: 200px;
      height: 200px;
    }
    .spinner {
      width: 100%;
      height: 100%;
      border: 8px solid transparent;
      border-top: 8px solid #fff;
      border-radius: 50%;
      animation: spin 2s linear infinite;
      position: absolute;
      top: 0;
      left: 0;
      box-sizing: border-box;
    }
    .name-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 22px;
      font-weight: bold;
      z-index: 2;
      color: #fff;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="creator">تم صناعة التطبيق من قبل:</div>

  <div class="spinner-container">
    <div class="spinner"></div>
    <div class="name-center">محمد العضيلي</div>
  </div>

  <script>
    setTimeout(() => {
      const user = localStorage.getItem("user");
      if (user) {
        window.location.href = "accounts.html";  // لديه حساب → إلى الحسابات
      } else {
        window.location.href = "register.html";  // لا يملك حساب → إلى التسجيل
      }
    }, 5000);
  </script>

<script src="app.js"></script>
</body>
</html>
