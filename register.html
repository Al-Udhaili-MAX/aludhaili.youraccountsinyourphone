<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل حساب جديد</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="app.js"></script>

  <style>
    body {
      background: url('images/background-pen.gif') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Tajawal', sans-serif;
      padding: 20px;
      color: white;
    }

    .form-container {
      background-color: rgba(0, 0, 0, 0.7);
      border-radius: 20px;
      padding: 30px;
      max-width: 400px;
      margin: 60px auto;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      text-align: right;
    }

    button {
      background-color: #4CAF50;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .middle-button {
      display: block;
      margin: 20px auto;
      background-color: #2196F3;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>تسجيل حساب جديد</h2>

    <input type="text" id="username" placeholder="اسم المستخدم" required>
    <input type="password" id="password" placeholder="كلمة المرور" required>

    <button onclick="register()">تسجيل الحساب</button>

    <button class="middle-button" onclick="location.href='login.html'">لديك حساب؟ دخول</button>
  </div>

  <script>
    function register() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (username && password) {
        localStorage.setItem("user", JSON.stringify({ username, password }));
        alert("✅ تم تسجيل الحساب بنجاح!");
        window.location.href = "accounts.html";
      } else {
        alert("⚠️ يرجى إدخال اسم المستخدم وكلمة المرور.");
      }
    }
  </script>

<script src="app.js"></script>
</body>
</html>
