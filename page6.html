<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>⚙️ الإعدادات</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
  <script src="firebase-init.js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Tahoma', sans-serif;
      background: url('background6.gif') no-repeat center center fixed;
      background-size: cover;
      color: white;
      padding-bottom: 60px;
    }
    h1 {
      text-align: center;
      margin-top: 20px;
    }
    .section {
      background: rgba(0, 0, 0, 0.6);
      margin: 20px;
      padding: 20px;
      border-radius: 12px;
    }
    label {
      display: block;
      margin: 10px 0 5px;
    }
    input[type="text"],
    input[type="password"],
    input[type="number"],
    select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-bottom: 10px;
    }
    button {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }
    button:hover {
      background-color: #218838;
    }
    .footer-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 1000;
    }
    .footer-nav button {
      background: none;
      border: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
      transition: color 0.3s;
    }
    .footer-nav button:hover,
    .footer-nav button.active {
      color: #FFD700;
    }
  </style>
</head>
<body>

  <h1>⚙️ الإعدادات</h1>

  <div class="section">
    <h2>🔐 حساب تسجيل الدخول</h2>
    <label>اسم المستخدم:</label>
    <input type="text" id="username" readonly value="محمد" />
    <label>كلمة المرور:</label>
    <input type="password" id="password" readonly value="123456" />
    <button onclick="logout()">تسجيل الخروج</button>
  </div>

  <div class="section">
    <h2>🔧 الإعدادات</h2>
    <label>قفل التطبيق برمز:</label>
    <input type="number" id="lockCode" placeholder="أدخل رمز القفل" />
    <button onclick="saveCode()">💾 حفظ الرمز</button>
    <label>نغمة المنبه:</label>
    <select id="alarmTone">
      <option>النغمة 1</option>
      <option>النغمة 2</option>
      <option>النغمة 3</option>
    </select>
  </div>

  <!-- شريط التنقل السفلي -->
  <nav class="footer-nav">
    <button id="navPage4" title="إضافة حساب مالي">🗒️</button>
    <button id="navPage5" title="الديون">💰</button>
    <button id="navPage6" title="الإعدادات">⚙️</button>
  </nav>

  <script>
    document.getElementById('navPage4').onclick = () => location.href = 'accounts.html';
    document.getElementById('navPage5').onclick = () => location.href = 'debts.html';
    document.getElementById('navPage6').classList.add('active');

    function logout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }

    function saveCode() {
      const code = document.getElementById('lockCode').value;
      if (code.length > 0) {
        localStorage.setItem('lockCode', code);
        alert('✅ تم حفظ الرمز بنجاح!');
      } else {
        alert('⚠️ يرجى إدخال رمز قبل الحفظ');
      }
    }
  </script>

  <!-- إشعارات Firebase -->
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const lastShown = localStorage.getItem('lastNotificationId');

      try {
        const snapshot = await db.collection("notifications")
          .orderBy("createdAt", "desc")
          .limit(1)
          .get();

        if (!snapshot.empty) {
          const doc = snapshot.docs[0];
          const data = doc.data();

          if (doc.id !== lastShown) {
            localStorage.setItem('lastNotificationId', doc.id);

            if (data.type === 'popup' || data.type === 'both') {
              showInPageNotification(data.title, data.message);
            }

            if ((data.type === 'notification' || data.type === 'both') && "Notification" in window) {
              Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                  new Notification(data.title, { body: data.message });
                }
              });
            }
          }
        }
      } catch (e) {
        console.error("فشل جلب الإشعار:", e);
      }

      function showInPageNotification(title, message) {
        const div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '50%';
        div.style.left = '50%';
        div.style.transform = 'translate(-50%, -50%)';
        div.style.background = 'rgba(0,0,0,0.85)';
        div.style.padding = '20px';
        div.style.color = 'white';
        div.style.borderRadius = '15px';
        div.style.zIndex = '9999';
        div.style.maxWidth = '90%';
        div.style.textAlign = 'center';
        div.style.fontSize = '18px';

        div.innerHTML = `<h3>${title}</h3><p>${message}</p><button onclick="this.parentElement.remove()">موافق</button>`;
        document.body.appendChild(div);
      }
    });
  </script>

<script src="app.js"></script>
</body>
</html>
